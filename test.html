<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Flex — Checkout With Your HSA/FSA</title>
<style>
  :root{
    --bg:#f8f5f2;
    --card:#f5eee9;
    --ink:#1b1b1f;
    --muted:#5c616f;
    --brand:#1b1470;           /* deep indigo */
    --accent:#ff8b2a;          /* orange badge */
    --white:#fff;
    --radius:24px;
    --shadow:0 1px 2px rgba(0,0,0,.06), 0 6px 24px rgba(0,0,0,.06);
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Inter,Arial,Apple Color Emoji,Segoe UI Emoji;
    color:var(--ink);
    background:var(--bg);
    line-height:1.45;
  }
  .wrap{
    max-width:880px;
    margin:2rem auto 4rem;
    padding: clamp(16px,4vw,32px);
    background:var(--white);
    border-radius:32px;
    box-shadow: var(--shadow);
  }
  header{
    text-align:center;
    margin-bottom:1.5rem;
  }
  .logo{
    font-weight:800;
    color:var(--brand);
    font-size: clamp(28px,4.2vw,44px);
    letter-spacing:.5px;
  }
  h1{
    margin:.25rem 0 0;
    font-size: clamp(22px,3.2vw,34px);
  }
  .sub{
    color:var(--muted);
    margin:.4rem 0 1.6rem;
    font-size: clamp(15px,2.3vw,18px);
  }

  ol.steps{
    list-style:none;
    padding:0;
    margin:0;
    display:grid;
    gap:18px;
  }

  .step{
    background:var(--card);
    border-radius:20px;
    padding: clamp(14px,2.2vw,20px);
  }
  .step > .row{
    display:grid;
    grid-template-columns:auto 1fr;
    gap:14px clamp(12px,2vw,18px);
    align-items:start;
  }
  .badge{
    display:inline-grid;
    place-items:center;
    width:44px;
    height:44px;
    border-radius:12px;
    background:var(--accent);
    color:#fff;
    font-weight:800;
    font-size:18px;
    box-shadow: var(--shadow);
    user-select:none;
  }
  .step h2{
    margin:.25rem 0 .25rem;
    font-size: clamp(18px,2.6vw,22px);
  }
  .step p{
    margin:.25rem 0 .75rem;
    color:var(--muted);
  }

  .screenshot{
    background:var(--white);
    border-radius:14px;
    padding: clamp(12px,2vw,18px);
    box-shadow: var(--shadow);
  }
  /* simple placeholder image styling */
  .screenshot img{
    display:block;
    width:100%;
    height:auto;
    border-radius:10px;
    background:#fff;
  }

  /* visual “mock” UI bits so it reads like the original */
  .mock{
    width:100%;
    height:auto;
  }
  /* button mock (step 2) */
  .btn-mock{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    background:var(--brand);
    color:#fff;
    font-weight:700;
    border-radius:10px;
    padding:18px 20px;
    box-shadow: inset 0 0 0 2px rgba(255,255,255,.06);
  }
  .btn-mock small{opacity:.9}
  /* form mocks (steps 3–4) */
  .field{
    border:1px solid #e7e0da;
    border-radius:10px;
    padding:12px 14px;
    color:#6a6f7a;
    background:#fff;
  }
  .grid{
    display:grid;
    gap:10px;
  }
  .grid.cols-2{grid-template-columns:1fr 1fr}
  .grid.cols-3{grid-template-columns:1fr auto 120px}
  .label{font-size:12px;color:#757b88;margin:.4rem 0 .25rem}
  .inline{
    display:flex; gap:8px; align-items:center; justify-content:flex-end
  }
  @media (max-width:620px){
    .step > .row{grid-template-columns: 44px 1fr}
  }
</style>
</head>
<body>
  <main class="wrap" aria-labelledby="title">
    <header>
      <div class="logo" aria-label="Flex">flex</div>
      <h1 id="title">Checkout With Your HSA/FSA</h1>
      <p class="sub">Maximize your pre-tax HSA/FSA dollars.</p>
    </header>

    <ol class="steps">
      <!-- Step 1 -->
      <li class="step">
        <div class="row">
          <div class="badge" aria-hidden="true">1</div>
          <div>
            <h2>Checkout as a guest.</h2>
          </div>
        </div>
      </li>

      <!-- Step 2 -->
      <li class="step">
        <div class="row">
          <div class="badge" aria-hidden="true">2</div>
          <div>
            <h2>Select the Flex | Pay with HSA/FSA option.</h2>

            <figure class="screenshot">
              <!-- This SVG is only a visual placeholder. The important part is the alt text. -->
              <img
              src="..."
              alt="Screenshot: a checkout page section showing a single large dark-blue button labeled “flex | Pay with HSA/FSA.” Selecting it chooses Flex as the payment method." />
              <figcaption class="visually-hidden">Payment option screenshot</figcaption>
            </figure>
          </div>
        </div>
      </li>

      <!-- Step 3 -->
      <li class="step">
        <div class="row">
          <div class="badge" aria-hidden="true">3</div>
          <div>
            <h2>Confirm your eligibility.</h2>

            <figure class="screenshot" role="group" aria-label="Eligibility prompt screenshot">
              <img
              src="..."
              alt="Screenshot: a Flex prompt reads “What condition are you seeking treatment for?” with a single-line text field labeled “Your Condition” and a small arrow submit button on the right." />
            </figure>
          </div>
        </div>
      </li>

      <!-- Step 4 -->
      <li class="step">
        <div class="row">
          <div class="badge" aria-hidden="true">4</div>
          <div>
            <h2>Enter your HSA/FSA card details &amp; enjoy your savings!</h2>

            <figure class="screenshot" role="group" aria-label="HSA/FSA payment form screenshot">
              <img
                src="..."
                alt="Screenshot: a payment form titled “HSA/FSA Payment” with fields for Card Number, Expiration (MM/YY), Security code (CVC), Country (dropdown), and Zip code, plus small Visa/Mastercard/AmEx/Discover icons near the card number field." />
            </figure>
          </div>
        </div>
      </li>
    </ol>
  </main>

  <!-- Optional: visually-hidden utility (kept minimal, in case you add visible captions later) -->
  <style>
    .visually-hidden{
      position:absolute!important;
      width:1px;height:1px;
      padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;
    }
  </style>
</body>
</html>
